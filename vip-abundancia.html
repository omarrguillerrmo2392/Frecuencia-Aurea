<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit VIP | 21 Días de Abundancia Áurea</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-abundancia">
    <div class="overlay"></div>
    
    <div class="container">
        <img src="assets/Logotipo.jpeg" alt="Frecuencia Áurea" class="logo">
        
        <div class="card">
            <h1>Kit VIP: 21 Días de Abundancia</h1>
            <p>Tu transformación cuántica diaria. Selecciona el día que te corresponde hoy:</p>
            
            <!-- Selector de Días -->
            <div class="selector-dias-container">
                <label for="select-dia">Día del Reto:</label>
                <select id="select-dia">
                    <option value="1">Día 1: Despertar de la Conciencia Financiera</option>
                    <option value="2">Día 2: Limpieza del Linaje de Escasez</option>
                    <option value="3">Día 3: Sellado de Fugas Energéticas</option>
                    <option value="4">Día 4: Activación del Chakra Raíz</option>
                    <option value="5">Día 5: Transmutación del Miedo al Gasto</option>
                    <option value="6">Día 6: Sintonía con la Riqueza Inesperada</option>
                    <option value="7">Día 7: Ruptura de Contratos de Pobreza</option>
                    <option value="8">Día 8: Expansión del Campo Magnético</option>
                    <option value="9">Día 9: Cosecha de Oportunidades Lucrativas</option>
                    <option value="10">Día 10: Activación de la Intuición Financiera</option>
                    <option value="11">Día 11: Reconfiguración del Dinero Fácil</option>
                    <option value="12">Día 12: Bloqueo de Entornos de Escasez</option>
                    <option value="13">Día 13: Sanación del Techo de Cristal</option>
                    <option value="14">Día 14: Magnetismo de Clientes y Ventas</option>
                    <option value="15">Día 15: Anclaje de la Opulencia Permanente</option>
                    <option value="16">Día 16: Liberación de Deudas y Culpas</option>
                    <option value="17">Día 17: Frecuencia de Crecimiento Exponencial</option>
                    <option value="18">Día 18: Armonización del Dar y Recibir</option>
                    <option value="19">Día 19: Blindaje Áurico Financiero</option>
                    <option value="20">Día 20: Conexión con la Fuente Inagotable</option>
                    <option value="21">Día 21: Anclaje de la Frecuencia Áurea</option>
                </select>
            </div>

            <!-- Contenido del Día Seleccionado -->
            <div class="decreto-box" style="margin-top: 15px;">
                <h3 id="titulo-dia-txt">Día 1: Despertar de la Conciencia Financiera</h3>
                
                <p style="margin-top: 10px;"><strong>Decreto:</strong></p>
                <p id="decreto-txt" style="font-style: italic; color: #fff;"></p>
                
                <p style="margin-top: 10px;"><strong>Acción Cuántica:</strong></p>
                <p id="accion-txt" style="color: #f4d03f;"></p>

                <!-- Reproductor del Día -->
                <audio id="audio-vip" controls controlsList="nodownload" style="margin-top: 15px;">
                    <source id="source-vip" src="" type="audio/mpeg">
                    Tu navegador no soporta el reproductor.
                </audio>
            </div>
            
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: #888; font-size: 0.85rem; text-decoration: underline;">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <!-- Base de datos incrustada de los 21 días (Excel) -->
    <script>
        const datos21Dias = {
            1: { nombre: "Despertar de la Conciencia Financiera", decreto: "Yo reconozco que la abundancia es mi estado natural y divino. Abro hoy los portales de mi mente para recibir riqueza ilimitada, disolviendo toda resistencia inconsciente. Yo soy el imán perfecto para el dinero aquí y ahora.", accion: "Revisa tu billetera física o aplicación bancaria y bendice cada moneda o número que veas, agradeciendo su presencia en tu vida." },
            2: { nombre: "Limpieza del Linaje de Escasez", decreto: "Yo devuelvo con amor toda creencia de sacrificio y pobreza a mis ancestros. Rompo hoy el techo de cristal de mi árbol genealógico, instaurando un nuevo paradigma de riqueza infinita para mí y los que siguen. Yo soy el corte del patrón.", accion: "Enciende un fósforo, obsérvalo arder por tres segundos y sóplalo visualizando que el humo se lleva los miedos financieros heredados." },
            3: { nombre: "Sellado de Fugas Energéticas", decreto: "Yo ordeno el cierre inmediato de cualquier fuga energética en mi campo áurico. Recupero mi poder sobre mis finanzas, reteniendo y multiplicando cada centavo que llega a mis manos. Yo soy una bóveda de oro impenetrable y expansiva.", accion: "Cierra firmemente todos los grifos de tu casa. Mientras lo haces, decreta mentalmente que estás cerrando cualquier pérdida de dinero en tu vida." },
            4: { nombre: "Activación del Chakra Raíz", decreto: "Yo anclo mi energía en la abundancia material de la Tierra. Me siento seguro, próspero y digno de generar grandes sumas de dinero sin esfuerzo abrumador. Yo soy la solidez financiera materializada en el plano físico.", accion: "Camina descalzo por un minuto sobre el suelo, sintiendo cómo la energía del planeta te sostiene, te alimenta y te da seguridad material." },
            5: { nombre: "Transmutación del Miedo al Gasto", decreto: "Yo bendigo cada pago que realizo porque sé que el dinero regresa a mi multiplicado por setenta veces siete. El universo es mi fuente inagotable y mi flujo de caja es constante, seguro y exponencial. Yo soy la fluidez de la riqueza.", accion: "Al hacer un pago hoy (físico o digital), sonríe conscientemente y respira profundo, sintiendo gratitud por tener los medios para cubrirlo." },
            6: { nombre: "Sintonía con la Riqueza Inesperada", decreto: "Yo expando mi canal receptor para recibir dinero de fuentes visibles e invisibles. El universo conspira a mi favor, atrayendo regalos, oportunidades lucrativas y sorpresas financieras en este preciso instante.", accion: "Coloca un billete o moneda en un lugar inusual de tu casa u oficina y di en voz alta: 'Aquí comienza a manifestarse lo inesperado'." },
            7: { nombre: "Ruptura de Contratos de Pobreza", decreto: "Yo desecho de la falsa humildad y me declaro heredero legítimo de la opulencia universal. Rompo todo pacto subconsciente de carencia y me alineo con la frecuencia del éxito financiero rotundo.", accion: "Escribe en un papel: 'Renuncio a la escasez' y rómpelo en pedazos pequeños mientras exhalas con fuerza liberadora." },
            8: { nombre: "Expansión del Campo Magnético", decreto: "Mi campo electromagnético vibra tan alto que el dinero se siente atraído inexorablemente hacia mí. Yo no persigo la riqueza; yo soy el centro magnético donde la abundancia converge por ley natural.", accion: "Estira los brazos al frente, abre y cierra las manos tres veces visualizando un aro de luz dorada expandiéndose alrededor de tu cuerpo." },
            9: { nombre: "Cosecha de Oportunidades Lucrativas", decreto: "Mis ojos espirituales y físicos están abiertos para reconocer negocios altamente rentables. Yo actúo con precisión quirúrgica, tomando decisiones financieras que multiplican mis ingresos diarios.", accion: "Anota en tu celular una idea de negocio o mejora económica que hayas postergado y da el primer micro-paso para ejecutarla hoy." },
            10: { nombre: "Activación de la Intuición Financiera", decreto: "Yo purifico mi glándula pineal para recibir descargas divinas de ideas millonarias. Confío en mi visión interna para tomar decisiones precisas que catapultan mi crecimiento económico. Yo soy la mente brillante respaldada por el cosmos.", accion: "Lávate la cara con agua fría, enfocándote en el centro de tu frente (tercer ojo) e imagina que se enciende una luz dorada de claridad." },
            11: { nombre: "Reconfiguración del Dinero Fácil", decreto: "Yo libero la creencia limitante de que el dinero se gana con sufrimiento. El dinero fluye hacia mí de manera fácil, frecuente, gozosa y abundante.", accion: "Repite tres veces frente al espejo con una sonrisa: 'Ganar dinero es fácil y natural para mí'." },
            12: { nombre: "Bloqueo de Entornos de Escasez", decreto: "Yo me blindo ante la queja, el pesimismo y la mentalidad de carencia de mi entorno. Mi vibración económica es independiente y soberana.", accion: "Silencia o ignora conscientemente cualquier conversación o noticia sobre crisis financiera durante todo el día." },
            13: { nombre: "Sanación del Techo de Cristal", decreto: "Yo destruyo los límites mentales sobre cuánto dinero puedo ganar. Mis ingresos rompen barreras anteriores y se expanden hacia nuevos niveles históricos para mí.", accion: "Imagina mentalmente un techo de vidrio sobre tu cabeza rompiéndose en mil pedazos dorados mientras inhalas profundo." },
            14: { nombre: "Magnetismo de Clientes y Ventas", decreto: "Yo soy un imán irresistible de clientes ideales, contratos cerrados y transacciones exitosas. Todo lo que ofrezco al mundo tiene un valor incalculable y se vende con facilidad.", accion: "Visualiza una fila de personas interesadas en tus habilidades o productos, entregándote dinero con alegría y agradecimiento." },
            15: { nombre: "Anclaje de la Opulencia Permanente", decreto: "La opulencia no es una fase temporal en mi vida; es mi estado permanente de existencia. Yo vivo, respiró y proyecto abundancia en cada acción.", accion: "Elige una prenda u objeto que tengas hoy que represente elegancia o valor, úsala con total consciencia de tu estatus próspero." },
            16: { nombre: "Liberación de Deudas y Culpas", decreto: "Yo libero la culpa asociada a mis deudas pasadas. Las transmuto en experiencia y declaro mis cuentas saldadas por el flujo infinito del universo.", accion: "Visualiza tus deudas actuales transformándose en partículas de luz dorada que se disuelven y desaparecen de tu realidad." },
            17: { nombre: "Frecuencia de Crecimiento Exponencial", decreto: "Mi dinero no solo se mantiene; se multiplica de forma geométrica y constante. Mis inversiones y proyectos fructifican más allá de toda expectativa lógica.", accion: "Multiplica mentalmente por diez el monto de dinero que deseas ver en tu cuenta este mes y siente la emoción de tenerlo ya." },
            18: { nombre: "Armonización del Dar y Recibir", decreto: "Yo doy con generosidad desbordante y recibo con gracia infinita. El equilibrio cósmico de la riqueza opera perfectamente a través de mí.", accion: "Haz una pequeña donación, un regalo inesperado o ten un gesto de generosidad material con alguien hoy sin esperar nada a cambio." },
            19: { nombre: "Blindaje Áurico Financiero", decreto: "Mi aura financiera está blindada contra la envidia, el mal de ojo y las malas energías ajenas. Mi prosperidad es intocable y bendecida por la luz.", accion: "Visualiza un escudo dorado brillante cubriendo todo tu cuerpo como una burbuja impenetrable frente a energías externas de carencia." },
            20: { nombre: "Conexión con la Fuente Inagotable", decreto: "Yo reconozco que la fuente de mi riqueza nunca se agota porque el universo es infinito. Yo soy uno con la providencia divina.", accion: "Mira el cielo por un minuto, respira profundamente y agradece la inmensidad del universo sabiendo que todo te pertenece." },
            21: { nombre: "Anclaje de la Frecuencia Áurea", decreto: "Yo sello permanentemente la frecuencia áurea en mi ADN, mi mente y mi espíritu. La abundancia es ahora mi piloto automático, y el dinero me persigue a cada paso que doy sin esfuerzo alguno. Yo soy la totalidad, la riqueza y el éxito eterno.", accion: "Dibuja con tu dedo índice un símbolo de infinito sobre el centro de tu pecho, sellando tu ciclo de 21 días con absoluta certeza." }
        };

        const selectDia = document.getElementById('select-dia');
        const tituloDiaTxt = document.getElementById('titulo-dia-txt');
        const decretoTxt = document.getElementById('decreto-txt');
        const accionTxt = document.getElementById('accion-txt');
        const audioVip = document.getElementById('audio-vip');
        const sourceVip = document.getElementById('source-vip');

        function cargarDia(diaNum) {
            const data = datos21Dias[diaNum];
            tituloDiaTxt.innerText = `Día ${diaNum}: ${data.nombre}`;
            decretoTxt.innerText = data.decreto;
            accionTxt.innerText = data.accion;

            // Nomenclatura exacta de tus audios VIP
            const nombreArchivoAudio = `Premium - Abundancia - Día ${diaNum}.MP3`;
            sourceVip.src = `assets/${encodeURIComponent(nombreArchivoAudio)}`;
            audioVip.load();
        }

        // Cargar por defecto el Día 1 al abrir
        cargarDia(1);

        // Cambiar contenido al mover el selector
        selectDia.addEventListener('change', function(e) {
            cargarDia(e.target.value);
        });
    </script>
</body>
</html>
